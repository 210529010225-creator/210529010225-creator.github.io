<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>个人工作台</title>
<style>
:root{
  --bg:#f6f7f8;--panel:#ffffff;--text:#181b20;--muted:#737a84;--line:#e7e9ed;
  --dark:#171a1f;--soft:#f0f2f5;--shadow:0 8px 26px rgba(20,24,32,.055);
  --radius:18px;
}
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:#15181d;color:#fff;padding:24px 18px}
.brand{font-size:20px;font-weight:800;padding:4px 8px 28px}.brand small{display:block;font-size:11px;color:#969da8;font-weight:500;margin-top:5px}
.nav button{width:100%;border:0;background:transparent;color:#adb4bd;text-align:left;padding:12px;border-radius:10px;margin:3px 0}
.nav button.active,.nav button:hover{background:#252a32;color:#fff}
.sidebar-note{position:absolute;left:22px;right:22px;bottom:24px;color:#8f96a0;font-size:11px;line-height:1.65}
main{padding:34px 38px 60px;max-width:1480px}
.view{display:none}.view.active{display:block}
.header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}
h1{margin:0 0 7px;font-size:30px;letter-spacing:-.7px}.sub{color:var(--muted);font-size:13px;line-height:1.6}
.sync{font-size:11px;color:#747b84;background:#fff;border:1px solid var(--line);padding:7px 10px;border-radius:999px}
.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.stat{padding:17px 18px}.stat-label{font-size:11px;color:var(--muted)}.stat-value{font-size:24px;font-weight:800;margin-top:7px}
.calendar-strip{display:flex;gap:9px;overflow:auto;padding:4px 1px 14px}.date-chip{border:1px solid var(--line);background:#fff;border-radius:13px;padding:9px 13px;min-width:88px;text-align:left}.date-chip.active{background:#20242a;color:#fff;border-color:#20242a}.date-chip .dow{font-size:10px;opacity:.72}.date-chip .day{font-size:17px;font-weight:800;margin-top:2px}
.day-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);gap:16px}.timeline{padding:18px}.day-title{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.day-title h2{font-size:18px;margin:0}.focus{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
.hour-row{display:grid;grid-template-columns:58px 1fr;min-height:58px;border-top:1px solid var(--line)}.hour-row:first-of-type{border-top:0}.hour{font-size:11px;color:#969ca5;padding-top:12px}.hour-body{padding:7px 0 7px 12px;border-left:1px solid var(--line)}
.event{background:#f6f7f9;border:1px solid #e4e7eb;border-radius:11px;padding:9px 11px;margin:2px 0}.event.done{background:#f2f5f2}.event-time{font-size:10px;color:#828993}.event-title{font-size:13px;font-weight:750;margin-top:3px}.event-meta{font-size:11px;color:#767d86;margin-top:4px}
.queue{padding:18px}.queue h2{font-size:16px;margin:0 0 12px}.queue-item{padding:12px 0;border-top:1px solid var(--line)}.queue-item:first-of-type{border-top:0}.queue-group{font-size:10px;color:#8a919a;margin-bottom:4px}.queue-title{font-size:13px;font-weight:650}.queue-meta{font-size:11px;color:var(--muted);margin-top:4px}.queue-note{white-space:pre-wrap;font-size:11px;color:#646b74;line-height:1.6;margin-top:7px;background:#f7f8f9;border:1px solid var(--line);border-radius:9px;padding:8px 9px}
.badge{display:inline-flex;align-items:center;font-size:10px;border-radius:999px;padding:4px 7px;background:var(--soft);color:#646b74}.badge.high{background:#f4e8e8;color:#934343}.badge.mid{background:#f3efe3;color:#826a31}.badge.done{background:#e9f0e9;color:#4e7053}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}.section-title h2{font-size:17px;margin:0}.section-count{font-size:11px;color:var(--muted)}
.project-grid{display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:14px}.project-card{padding:18px;cursor:pointer;transition:.15s transform,.15s box-shadow}.project-card:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(20,24,32,.08)}
.project-card.completed{opacity:.74}.project-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.project-name{font-size:15px;font-weight:800;line-height:1.35}.project-bg{font-size:12px;color:#707781;line-height:1.55;margin:10px 0 13px;min-height:55px}
.progressbar{height:7px;background:#eceef1;border-radius:99px;overflow:hidden}.progressbar span{display:block;height:100%;background:#343943;border-radius:99px}.progress-row{display:flex;gap:9px;align-items:center}.progress-num{width:34px;text-align:right;font-size:11px;color:#808791}.next{font-size:11px;color:#59606a;margin-top:11px;line-height:1.55}
.knowledge-toolbar{display:flex;gap:10px;margin-bottom:14px}.search{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px}
.knowledge-grid{display:grid;grid-template-columns:repeat(2,minmax(280px,1fr));gap:14px}.knowledge-card{padding:18px;cursor:pointer}.knowledge-card h3{margin:0;font-size:15px}.knowledge-summary{font-size:12px;color:#666d76;line-height:1.65;margin:10px 0}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:10px;background:#f1f2f4;color:#696f77;padding:4px 7px;border-radius:999px}.knowledge-foot{display:flex;justify-content:space-between;gap:10px;margin-top:13px;font-size:10px;color:#8b9199}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed #d9dde2;border-radius:14px;font-size:12px}
.modal-wrap{position:fixed;inset:0;background:rgba(8,10,13,.42);display:flex;align-items:center;justify-content:center;padding:24px;z-index:20}.modal{width:min(900px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;box-shadow:0 25px 90px rgba(0,0,0,.2)}.modal-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:20px 22px;display:flex;justify-content:space-between;gap:20px;align-items:flex-start;z-index:2}.modal-head h2{font-size:20px;margin:0 0 5px}.close{border:0;background:#f1f2f4;width:32px;height:32px;border-radius:9px}.modal-body{padding:22px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}.detail-box{border:1px solid var(--line);border-radius:14px;padding:14px}.detail-box.full{grid-column:1/-1}.detail-label{font-size:10px;color:#8d939b;text-transform:uppercase;letter-spacing:.3px}.detail-text{font-size:13px;line-height:1.65;margin-top:6px}
.work-table{width:100%;border-collapse:collapse}.work-table th,.work-table td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);vertical-align:top}.work-table th{font-size:10px;color:#8b9199;font-weight:650}.work-table td{font-size:12px;line-height:1.55}.status-dot{white-space:nowrap}
.source-link{display:block;margin-top:8px;font-size:12px;color:#303742;text-decoration:none;background:#f7f8f9;border:1px solid var(--line);border-radius:10px;padding:9px 10px}.source-link:hover{background:#f1f3f5}
.week-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.week-title{font-size:16px;font-weight:800}.week-nav{display:flex;gap:7px}.week-nav button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;color:#5e656e}.week-wrap{overflow:auto}.week-calendar{min-width:1120px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}.week-head,.week-row{display:grid;grid-template-columns:64px repeat(7,minmax(145px,1fr))}.week-head{position:sticky;top:0;z-index:2;background:#fafbfc;border-bottom:1px solid var(--line)}.week-head>div{padding:11px 9px;border-left:1px solid var(--line);font-size:11px;color:#727983;text-align:center}.week-head>div:first-child{border-left:0}.week-head .today-col{background:#f0f2f5;color:#22272e;font-weight:800}.week-row{min-height:66px;border-bottom:1px solid var(--line)}.week-row:last-child{border-bottom:0}.week-time{padding:11px 8px;font-size:10px;color:#9298a1}.week-cell{padding:5px;border-left:1px solid var(--line);min-height:66px}.week-cell.today-col{background:#fbfbfc}.week-event{border:1px solid #e2e5e9;background:#f6f7f9;border-radius:9px;padding:7px 8px;margin-bottom:4px}.week-event.done{background:#f0f4f0}.week-event-time{font-size:9px;color:#858c95}.week-event-title{font-size:11px;font-weight:700;line-height:1.35;margin-top:2px}.week-event-project{font-size:9px;color:#7d848d;margin-top:3px}.week-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.week-summary .panel{padding:15px 17px}
@media(max-width:980px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto}.sidebar-note{position:static;margin-top:20px}.nav{display:flex;gap:5px;overflow:auto}.nav button{width:auto;white-space:nowrap}main{padding:24px 17px}.day-grid,.project-grid,.knowledge-grid,.detail-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">个人工作台<small>时间 · 项目 · 知识</small></div>
  <div class="nav">
    <button class="active" data-view="day">📅 每日</button>
    <button data-view="week">🗓️ 每周</button>
    <button data-view="projects">项目</button>
    <button data-view="knowledge">知识库</button>
  </div>
  <div class="sidebar-note">你只需要告诉我今天做了什么、项目进展和需要检索的主题。<br><br>网站由我更新。</div>
</aside>

<main>
<section id="dayView" class="view active">
  <div class="header"><div><h1>每日时间轴</h1><div class="sub">按小时记录每天做了什么；未排入时间轴的事项放在右侧待安排区。</div></div><span class="sync" id="updatedAt"></span></div>
  <div class="stats">
    <div class="panel stat"><div class="stat-label">今日已记录</div><div class="stat-value" id="recordedHours">0h</div></div>
    <div class="panel stat"><div class="stat-label">待安排</div><div class="stat-value" id="queueCount">0</div></div>
    <div class="panel stat"><div class="stat-label">进行中项目</div><div class="stat-value" id="activeCount">0</div></div>
  </div>
  <div id="dateStrip" class="calendar-strip"></div>
  <div class="day-grid">
    <div class="panel timeline">
      <div class="day-title"><div><h2 id="selectedDateTitle"></h2><div class="focus" id="dayFocus"></div></div></div>
      <div id="timelineRows"></div>
    </div>
    <div class="panel queue"><h2>今日待安排</h2><div id="todayQueue"></div></div>
  </div>
</section>

<section id="weekView" class="view">
  <div class="header"><div><h1>每周时间表</h1><div class="sub">横向看周一到周日，纵向看每个小时；所有内容自动来自每日时间轴。</div></div><span class="sync">每日记录自动汇总</span></div>
  <div class="week-summary">
    <div class="panel stat"><div class="stat-label">本周已记录</div><div class="stat-value" id="weekHours">0h</div></div>
    <div class="panel stat"><div class="stat-label">涉及项目</div><div class="stat-value" id="weekProjects">0</div></div>
    <div class="panel stat"><div class="stat-label">记录事项</div><div class="stat-value" id="weekEvents">0</div></div>
  </div>
  <div class="week-toolbar">
    <div class="week-title" id="weekRangeTitle"></div>
    <div class="week-nav"><button onclick="shiftWeek(-7)">← 上一周</button><button onclick="goCurrentWeek()">本周</button><button onclick="shiftWeek(7)">下一周 →</button></div>
  </div>
  <div class="week-wrap"><div id="weekCalendar" class="week-calendar"></div></div>
</section>

<section id="projectsView" class="view">
  <div class="header"><div><h1>项目档案</h1><div class="sub">点开项目查看背景、当前状态、下一步和完整工作记录。</div></div><span class="sync">进行中 / 已完成分开归档</span></div>
  <div class="section-title"><h2>进行中</h2><span class="section-count" id="activeProjectCount"></span></div>
  <div id="activeProjects" class="project-grid"></div>
  <div class="section-title"><h2>已完成</h2><span class="section-count" id="completedProjectCount"></span></div>
  <div id="completedProjects" class="project-grid"></div>
</section>

<section id="knowledgeView" class="view">
  <div class="header"><div><h1>知识管理</h1><div class="sub">把检索主题、简要结论、关联项目和来源链接沉淀在这里。</div></div><span class="sync">检索完成后直接归档</span></div>
  <div class="knowledge-toolbar"><input id="knowledgeSearch" class="search" placeholder="搜索主题、标签或结论"></div>
  <div id="knowledgeGrid" class="knowledge-grid"></div>
</section>
</main>
</div>
<div id="modalRoot"></div>

<script>
let data={meta:{},days:[],projects:[],todayQueue:[],knowledge:[]};
let selectedDate="";
let selectedWeekStart="";

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function projectById(id){return data.projects.find(p=>p.id===id)}
function projectName(id){return projectById(id)?.name||"未关联项目"}
function priorityClass(v){return v==="高"?"high":v==="中"?"mid":""}
function fmtDate(s){if(!s)return"";const d=new Date(s+"T00:00:00");return d.toLocaleDateString("zh-CN",{month:"long",day:"numeric"})}
function weekday(s){const d=new Date(s+"T00:00:00");return ["周日","周一","周二","周三","周四","周五","周六"][d.getDay()]}
function durationHours(start,end){if(!start||!end)return 0;const [sh,sm]=start.split(":").map(Number),[eh,em]=end.split(":").map(Number);return Math.max(0,(eh*60+em-sh*60-sm)/60)}
function isoDate(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return y+"-"+m+"-"+day}
function mondayOf(dateStr){const d=new Date((dateStr||new Date().toISOString().slice(0,10))+"T00:00:00");const day=d.getDay();const diff=(day===0?-6:1-day);d.setDate(d.getDate()+diff);return isoDate(d)}
function addDays(dateStr,n){const d=new Date(dateStr+"T00:00:00");d.setDate(d.getDate()+n);return isoDate(d)}
function isToday(dateStr){return dateStr===isoDate(new Date())}

document.querySelectorAll(".nav button").forEach(btn=>btn.addEventListener("click",()=>{
  document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById(btn.dataset.view+"View").classList.add("active");
}));

function renderDayStrip(){
  const days=data.days.slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(!selectedDate) selectedDate=days[0]?.date||new Date().toISOString().slice(0,10);
  document.getElementById("dateStrip").innerHTML=days.length?days.map(d=>{
    const dt=new Date(d.date+"T00:00:00");
    return '<button class="date-chip '+(d.date===selectedDate?"active":"")+'" onclick="selectDate(\''+d.date+'\')"><div class="dow">'+weekday(d.date)+'</div><div class="day">'+(dt.getMonth()+1)+'/'+dt.getDate()+'</div></button>'
  }).join(""):'<div class="empty">还没有每日记录。</div>';
}
function selectDate(date){selectedDate=date;renderDayStrip();renderTimeline()}

function renderTimeline(){
  const day=data.days.find(d=>d.date===selectedDate)||{date:selectedDate,focus:"暂无记录",slots:[]};
  document.getElementById("selectedDateTitle").textContent=fmtDate(day.date)+" · "+weekday(day.date);
  document.getElementById("dayFocus").textContent=day.focus||"";
  const rows=[];
  for(let h=8;h<=22;h++){
    const hh=String(h).padStart(2,"0")+":00";
    const events=(day.slots||[]).filter(e=>parseInt(e.start,10)===h);
    rows.push('<div class="hour-row"><div class="hour">'+hh+'</div><div class="hour-body">'+
      (events.length?events.map(e=>'<div class="event '+(e.done?"done":"")+'"><div class="event-time">'+esc(e.start)+'–'+esc(e.end)+'</div><div class="event-title">'+esc(e.title)+'</div><div class="event-meta">'+esc(e.projectId?projectName(e.projectId):e.category||"")+(e.note?" · "+esc(e.note):"")+'</div></div>').join(""):"")+
      '</div></div>');
  }
  document.getElementById("timelineRows").innerHTML=rows.join("");
  const hours=(day.slots||[]).reduce((n,e)=>n+durationHours(e.start,e.end),0);
  document.getElementById("recordedHours").textContent=(Math.round(hours*10)/10)+"h";
}

function renderWeek(){
  if(!selectedWeekStart) selectedWeekStart=mondayOf(selectedDate||(data.days[0]?.date)||isoDate(new Date()));
  const dates=Array.from({length:7},(_,i)=>addDays(selectedWeekStart,i));
  const end=dates[6];
  document.getElementById("weekRangeTitle").textContent=fmtDate(selectedWeekStart)+" — "+fmtDate(end);
  const allSlots=[];
  for(const date of dates){
    const day=data.days.find(d=>d.date===date);
    for(const e of (day?.slots||[])) allSlots.push({...e,date});
  }
  document.getElementById("weekHours").textContent=(Math.round(allSlots.reduce((n,e)=>n+durationHours(e.start,e.end),0)*10)/10)+"h";
  document.getElementById("weekProjects").textContent=new Set(allSlots.map(e=>e.projectId).filter(Boolean)).size;
  document.getElementById("weekEvents").textContent=allSlots.length;

  let html='<div class="week-head"><div></div>'+dates.map(date=>'<div class="'+(isToday(date)?"today-col":"")+'"><div>'+weekday(date)+'</div><div style="font-weight:800;margin-top:3px">'+fmtDate(date)+'</div></div>').join("")+'</div>';
  for(let h=8;h<=22;h++){
    const hh=String(h).padStart(2,"0")+":00";
    html+='<div class="week-row"><div class="week-time">'+hh+'</div>';
    for(const date of dates){
      const day=data.days.find(d=>d.date===date);
      const events=(day?.slots||[]).filter(e=>parseInt(e.start,10)===h);
      html+='<div class="week-cell '+(isToday(date)?"today-col":"")+'">'+events.map(e=>'<div class="week-event '+(e.done?"done":"")+'"><div class="week-event-time">'+esc(e.start)+'–'+esc(e.end)+'</div><div class="week-event-title">'+esc(e.title)+'</div><div class="week-event-project">'+esc(e.projectId?projectName(e.projectId):e.category||"")+'</div></div>').join("")+'</div>';
    }
    html+='</div>';
  }
  document.getElementById("weekCalendar").innerHTML=html;
}
function shiftWeek(n){selectedWeekStart=addDays(selectedWeekStart||mondayOf(selectedDate),n);renderWeek()}
function goCurrentWeek(){selectedWeekStart=mondayOf(isoDate(new Date()));renderWeek()}

function renderQueue(){
  const list=data.todayQueue||[];
  document.getElementById("queueCount").textContent=list.length;
  document.getElementById("todayQueue").innerHTML=list.length?list.map(q=>'<div class="queue-item">'+(q.group?'<div class="queue-group">'+esc(q.group)+'</div>':'')+'<div class="queue-title">'+esc(q.title)+'</div>'+((q.projectId||q.priority)?'<div class="queue-meta">'+(q.projectId?esc(projectName(q.projectId)):'')+(q.priority?((q.projectId?' · ':'')+'<span class="badge '+priorityClass(q.priority)+'">'+esc(q.priority)+'优先级</span>'):'')+'</div>':'')+(q.note?'<div class="queue-note">'+esc(q.note)+'</div>':'')+'</div>').join(""):'<div class="empty">没有待安排事项。</div>';
}

function projectCard(p){
  return '<div class="card project-card '+(p.status==="已完成"?"completed":"")+'" onclick="openProject(\''+p.id+'\')">'+
    '<div class="project-top"><div class="project-name">'+esc(p.name)+'</div><span class="badge '+(p.status==="已完成"?"done":priorityClass(p.priority))+'">'+esc(p.status)+'</span></div>'+
    '<div class="project-bg">'+esc(p.current||p.background)+'</div>'+
    '<div class="progress-row"><div class="progressbar" style="flex:1"><span style="width:'+(p.progress==null?0:Number(p.progress))+'%"></span></div><div class="progress-num">'+(p.progress==null?"—":Number(p.progress)+"%")+'</div></div>'+
    '<div class="next">'+(p.status==="已完成"?"完成于 "+esc(p.completedDate||"—"):"下一步："+esc(p.next||"—"))+'</div>'+
    '</div>';
}
function renderProjects(){
  const active=data.projects.filter(p=>p.status!=="已完成");
  const completed=data.projects.filter(p=>p.status==="已完成");
  document.getElementById("activeCount").textContent=active.length;
  document.getElementById("activeProjectCount").textContent=active.length+" 个项目";
  document.getElementById("completedProjectCount").textContent=completed.length+" 个项目";
  document.getElementById("activeProjects").innerHTML=active.length?active.map(projectCard).join(""):'<div class="empty">目前没有进行中的项目。</div>';
  document.getElementById("completedProjects").innerHTML=completed.length?completed.map(projectCard).join(""):'<div class="empty">还没有已完成项目。</div>';
}

function openProject(id){
  const p=projectById(id);if(!p)return;
  const items=p.workItems||[];
  const rows=items.length?items.map(w=>'<tr><td>'+esc(w.date)+'</td><td>'+esc(w.content)+'</td><td>'+esc(w.review||"—")+'</td><td class="status-dot">'+(w.done?"✓ 已完成":"○ 进行中")+'</td></tr>').join(""):'<tr><td colspan="4">暂无工作记录</td></tr>';
  document.getElementById("modalRoot").innerHTML='<div class="modal-wrap" onclick="if(event.target===this)closeModal()"><div class="modal">'+
    '<div class="modal-head"><div><h2>'+esc(p.name)+'</h2><div class="sub">'+esc(p.status)+' · '+esc(p.priority)+'优先级 · '+(p.progress==null?"进度待确认":Number(p.progress)+"%")+'</div></div><button class="close" onclick="closeModal()">×</button></div>'+
    '<div class="modal-body">'+
      '<div class="detail-grid">'+
        '<div class="detail-box full"><div class="detail-label">项目背景</div><div class="detail-text">'+esc(p.background)+'</div></div>'+
        '<div class="detail-box"><div class="detail-label">当前进展</div><div class="detail-text">'+esc(p.current||"—")+'</div></div>'+
        '<div class="detail-box"><div class="detail-label">下一步</div><div class="detail-text">'+esc(p.next||"—")+'</div></div>'+
      '</div>'+
      '<div class="section-title" style="margin-top:0"><h2>项目工作记录</h2><span class="section-count">'+items.length+' 条</span></div>'+
      '<div style="overflow:auto"><table class="work-table"><thead><tr><th>日期</th><th>项目内容</th><th>复盘 / 结论</th><th>状态</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '</div></div></div>';
}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}

function knowledgeCard(k){
  return '<div class="card knowledge-card" onclick="openKnowledge(\''+k.id+'\')"><div class="project-top"><h3>'+esc(k.title)+'</h3><span class="badge '+(k.status==="已整理"?"done":"")+'">'+esc(k.status)+'</span></div><div class="knowledge-summary">'+esc(k.summary)+'</div><div class="tags">'+(k.tags||[]).map(t=>'<span class="tag">'+esc(t)+'</span>').join("")+'</div><div class="knowledge-foot"><span>'+esc(k.relatedProjectId?projectName(k.relatedProjectId):"独立知识")+'</span><span>'+esc(k.updatedDate||"")+'</span></div></div>';
}
function renderKnowledge(){
  const q=(document.getElementById("knowledgeSearch").value||"").trim().toLowerCase();
  const list=(data.knowledge||[]).filter(k=>!q||[k.title,k.summary,(k.tags||[]).join(" "),projectName(k.relatedProjectId)].join(" ").toLowerCase().includes(q));
  document.getElementById("knowledgeGrid").innerHTML=list.length?list.map(knowledgeCard).join(""):'<div class="empty">没有匹配的知识条目。</div>';
}
document.getElementById("knowledgeSearch").addEventListener("input",renderKnowledge);

function openKnowledge(id){
  const k=data.knowledge.find(x=>x.id===id);if(!k)return;
  const links=(k.links||[]);
  const linkHtml=links.length?links.map(l=>'<a class="source-link" href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.title||l.url)+'</a>').join(""):'<div class="empty">这条知识目前还没有归档来源链接；后续检索完成后会放在这里。</div>';
  document.getElementById("modalRoot").innerHTML='<div class="modal-wrap" onclick="if(event.target===this)closeModal()"><div class="modal">'+
    '<div class="modal-head"><div><h2>'+esc(k.title)+'</h2><div class="sub">'+esc(k.status)+' · 更新于 '+esc(k.updatedDate||"")+'</div></div><button class="close" onclick="closeModal()">×</button></div>'+
    '<div class="modal-body"><div class="detail-grid">'+
      '<div class="detail-box full"><div class="detail-label">简要结论</div><div class="detail-text">'+esc(k.summary)+'</div></div>'+
      '<div class="detail-box"><div class="detail-label">关联项目</div><div class="detail-text">'+esc(k.relatedProjectId?projectName(k.relatedProjectId):"—")+'</div></div>'+
      '<div class="detail-box"><div class="detail-label">标签</div><div class="detail-text">'+esc((k.tags||[]).join(" · "))+'</div></div>'+
    '</div><div class="section-title"><h2>来源链接</h2><span class="section-count">'+links.length+' 条</span></div>'+linkHtml+'</div></div></div>';
}

async function load(){
  try{
    const r=await fetch("data.json?ts="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("load");
    data=await r.json();
  }catch(e){}
  document.getElementById("updatedAt").textContent="更新："+(data.meta?.updatedAt||"—");
  renderDayStrip();renderTimeline();renderWeek();renderQueue();renderProjects();renderKnowledge();
}
load();
</script>
</body>
</html>
