<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>项目工作台</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--text:#17191d;--muted:#727983;--line:#e7e9ed;--dark:#171a1f;--soft:#f0f2f5;--radius:18px;--shadow:0 8px 28px rgba(24,28,36,.06)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;background:#15181d;color:#fff;padding:24px 18px}
.brand{font-size:20px;font-weight:800;padding:4px 8px 24px}.brand small{display:block;color:#969da8;font-size:11px;font-weight:500;margin-top:5px}
.nav button{width:100%;border:0;background:transparent;color:#adb4bd;text-align:left;padding:11px 12px;border-radius:10px;margin:3px 0}.nav button.active,.nav button:hover{background:#252a32;color:#fff}
.side-actions{position:absolute;left:18px;right:18px;bottom:20px}.side-actions button{width:100%;border:1px solid #353b45;background:#1d2127;color:#dce1e7;padding:10px 12px;border-radius:10px;margin-top:7px}
main{padding:34px 38px 56px;max-width:1500px}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:28px}
h1{font-size:30px;letter-spacing:-.7px;margin:0 0 6px}.subtitle{color:var(--muted);font-size:14px}
.primary,.secondary,.danger{border-radius:11px;padding:10px 14px}.primary{border:0;background:#20242a;color:#fff;font-weight:650}.secondary{border:1px solid var(--line);background:#fff;color:#252930}.danger{border:1px solid #edd8d8;background:#fff;color:#a24b4b;margin-right:auto}
.cards{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px;margin-bottom:18px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.metric{padding:20px}.metric .k{font-size:12px;color:var(--muted);margin-bottom:9px}.metric .v{font-size:27px;font-weight:800}
.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.panel{padding:20px}.panel h2{font-size:16px;margin:0 0 16px}
.task{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}.task:first-child{border-top:0}.task input{width:17px;height:17px;margin-top:2px}.task.done .task-title{text-decoration:line-through;color:#989ea7}.task-meta{font-size:12px;color:var(--muted);margin-top:4px}
.pill{font-size:11px;padding:4px 8px;border-radius:999px;background:var(--soft);color:#5d636c;white-space:nowrap}.pill.high{background:#f4e9e9;color:#8d4242}.pill.medium{background:#f3efe3;color:#806a35}.pill.low{background:#eaf0ea;color:#507052}
.project{padding:15px 0;border-top:1px solid var(--line);cursor:pointer}.project:first-child{border-top:0}.project-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.project-name{font-weight:750}.project-next{font-size:12px;color:var(--muted);margin:6px 0 10px}
.bar{height:7px;background:#eceef1;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:#333842;border-radius:99px}.bar-row{display:flex;align-items:center;gap:10px}.pct{width:36px;text-align:right;font-size:11px;color:#7c828b}
.hidden{display:none!important}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed #d9dde3;border-radius:14px}
.project-grid{display:grid;grid-template-columns:repeat(3,minmax(230px,1fr));gap:14px}.project-card{padding:18px;cursor:pointer}.project-card h3{font-size:16px;margin:0 0 7px}.project-card .desc{color:#6f7680;font-size:12px;line-height:1.55;min-height:38px;margin-bottom:14px}.project-card .next{font-size:12px;margin:12px 0;color:#41464e}
.log-item{padding:14px 0;border-top:1px solid var(--line)}.log-item:first-child{border-top:0}.log-date{font-size:11px;color:var(--muted)}.log-title{font-weight:700;margin:4px 0}.log-body{font-size:13px;color:#555c65;line-height:1.55}
.modal-wrap{position:fixed;inset:0;background:rgba(11,13,16,.34);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modal{background:#fff;width:min(720px,100%);max-height:88vh;overflow:auto;border-radius:18px;padding:22px;box-shadow:0 25px 80px rgba(0,0,0,.18)}.modal h3{margin:0 0 18px;font-size:20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:12px;color:#69707a}input,textarea,select{border:1px solid #dfe2e7;border-radius:10px;padding:10px 11px;background:#fff;color:#20242a}textarea{min-height:88px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
@media(max-width:1000px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto}.side-actions{position:static;margin-top:18px}main{padding:24px 18px}.cards{grid-template-columns:repeat(2,1fr)}.grid2,.project-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">项目工作台<small>个人项目管理中心</small></div>
  <div class="nav">
    <button data-view="dashboard" class="active">总览</button>
    <button data-view="today">今日任务</button>
    <button data-view="projects">项目</button>
    <button data-view="logs">项目日志</button>
  </div>
  <div class="side-actions">
    <button id="exportBtn">导出备份</button>
    <button id="importBtn">导入备份</button>
    <input id="importFile" type="file" accept=".json" class="hidden">
  </div>
</aside>

<main>
<section id="dashboardView">
  <div class="topbar"><div><h1>工作总览</h1><div class="subtitle" id="todayLabel"></div></div><button class="primary" onclick="openTaskModal()">+ 新增任务</button></div>
  <div class="cards">
    <div class="card metric"><div class="k">进行中项目</div><div class="v" id="mProjects">0</div></div>
    <div class="card metric"><div class="k">待办事项</div><div class="v" id="mTodo">0</div></div>
    <div class="card metric"><div class="k">高优先级</div><div class="v" id="mHigh">0</div></div>
    <div class="card metric"><div class="k">已完成事项</div><div class="v" id="mDone">0</div></div>
  </div>
  <div class="grid2">
    <div class="panel"><h2>今日重点</h2><div id="dashTasks"></div></div>
    <div class="panel"><h2>项目进度</h2><div id="dashProjects"></div></div>
  </div>
</section>

<section id="todayView" class="hidden">
  <div class="topbar"><div><h1>今日任务</h1><div class="subtitle">只保留今天真正需要推进的事项。</div></div><button class="primary" onclick="openTaskModal()">+ 新增任务</button></div>
  <div class="panel"><div id="todayTasks"></div></div>
</section>

<section id="projectsView" class="hidden">
  <div class="topbar"><div><h1>项目</h1><div class="subtitle">集中查看背景、当前进展、下一步和完成度。</div></div><button class="primary" onclick="openProjectModal()">+ 新增项目</button></div>
  <div id="projectGrid" class="project-grid"></div>
</section>

<section id="logsView" class="hidden">
  <div class="topbar"><div><h1>项目日志</h1><div class="subtitle">记录关键进展、结论和方向变化。</div></div><button class="primary" onclick="openLogModal()">+ 新增进展</button></div>
  <div class="panel"><div id="logList"></div></div>
</section>
</main>
</div>
<div id="modalRoot"></div>

<script>
const defaultData={
projects:[
{id:"p1",name:"中澳税收居民 / 总机构研究",status:"进行中",priority:"高",progress:72,background:"为澳大利亚税务机关准备中国法律体系、税收居民身份及“总机构”相关研究。",current:"已完成中国法律体系、旧中澳协定居民规则、澳洲案例及部分中国案例研究。",next:"继续检索中国公开裁判、行政复议及税务实务中“境内设立企业但总机构在境外”的材料。",deadline:""},
{id:"p2",name:"GBA Tax Incentives — Session 05",status:"进行中",priority:"中",progress:90,background:"粤港澳大湾区税收优惠英文演讲及PPT，重点为趋严背景下的前置管理和持续合规。",current:"CIT、IIT、实质性运营及案例框架基本完成。",next:"完成区域政策 final double-check，并统一最终口径和 speaker script。",deadline:""},
{id:"p3",name:"税务师考试",status:"进行中",priority:"高",progress:30,background:"11月中旬参加税一、税二、涉税法律考试。",current:"已系统学习增值税、消费税，进入小税种 / 个税 / 企税阶段。",next:"按学习计划推进小税种，并记录每天完成章节。",deadline:"2026-11"},
{id:"p4",name:"电商审计与税务整改",status:"进行中",priority:"中",progress:35,background:"梳理2019–2026H1收入、增值税、企业所得税及股东个税等整改问题。",current:"已形成主要问题清单，等待进一步资料和口径核对。",next:"补充股东个税资料清单，并统一各年度收入和VAT处理口径。",deadline:""}
],
tasks:[
{id:"t1",title:"继续检索“总机构在境外”的中国案例 / 复议材料",projectId:"p1",priority:"高",done:false},
{id:"t2",title:"GBA：完成区域政策 final double-check",projectId:"p2",priority:"中",done:false},
{id:"t3",title:"税务师：推进小税种学习",projectId:"p3",priority:"高",done:false}
],
logs:[
{id:"l1",date:"2026-09-18",projectId:"p1",title:"澳洲案例与旧协定规则已完成",body:"已整理 Bywater、Huang、Songa Offshore 等案例，并确认旧中澳协定双重居民规则中的 POEM / head office 逻辑。"},
{id:"l2",date:"2026-09-18",projectId:"p1",title:"找到中国案例线索",body:"现有材料支持“总机构并不当然等于注册地”的分析，但仍需继续寻找更直接的反例或官方论证。"},
{id:"l3",date:"2026-09-17",projectId:"p2",title:"GBA 框架基本完成",body:"CIT 15%、IIT、实质性运营、自行判定及留存备查逻辑已形成。"}
]};
let data=JSON.parse(localStorage.getItem("projectDashboardData")||"null")||defaultData;
function save(){localStorage.setItem("projectDashboardData",JSON.stringify(data));renderAll()}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}
function projectName(id){return data.projects.find(p=>p.id===id)?.name||"未归属项目"}
function priorityClass(v){return v==="高"?"high":v==="中"?"medium":"low"}

function renderAll(){
 const active=data.projects.filter(p=>p.status!=="已完成");
 document.getElementById("mProjects").textContent=active.length;
 document.getElementById("mTodo").textContent=data.tasks.filter(t=>!t.done).length;
 document.getElementById("mHigh").textContent=data.tasks.filter(t=>!t.done&&t.priority==="高").length;
 document.getElementById("mDone").textContent=data.tasks.filter(t=>t.done).length;
 document.getElementById("todayLabel").textContent=new Date().toLocaleDateString("zh-CN",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
 const tasks=data.tasks.length?data.tasks.map(t=>`
 <div class="task ${t.done?"done":""}">
 <input type="checkbox" ${t.done?"checked":""} onchange="toggleTask('${t.id}')">
 <div><div class="task-title">${esc(t.title)}</div><div class="task-meta">${esc(projectName(t.projectId))}</div></div>
 <span class="pill ${priorityClass(t.priority)}">${t.priority}</span></div>`).join(""):'<div class="empty">今天还没有任务。</div>';
 document.getElementById("dashTasks").innerHTML=tasks;document.getElementById("todayTasks").innerHTML=tasks;
 document.getElementById("dashProjects").innerHTML=active.length?active.map(p=>`
 <div class="project" onclick="openProjectModal('${p.id}')">
 <div class="project-head"><div class="project-name">${esc(p.name)}</div><span class="pill ${priorityClass(p.priority)}">${p.priority}</span></div>
 <div class="project-next">下一步：${esc(p.next)}</div>
 <div class="bar-row"><div class="bar" style="flex:1"><span style="width:${p.progress}%"></span></div><div class="pct">${p.progress}%</div></div></div>`).join(""):'<div class="empty">还没有进行中的项目。</div>';
 document.getElementById("projectGrid").innerHTML=data.projects.map(p=>`
 <div class="card project-card" onclick="openProjectModal('${p.id}')">
 <div class="project-head"><h3>${esc(p.name)}</h3><span class="pill ${priorityClass(p.priority)}">${p.priority}</span></div>
 <div class="desc">${esc(p.background)}</div>
 <div class="bar-row"><div class="bar" style="flex:1"><span style="width:${p.progress}%"></span></div><div class="pct">${p.progress}%</div></div>
 <div class="next"><b>下一步：</b>${esc(p.next)}</div>
 <div class="task-meta">${esc(p.status)}${p.deadline?" · "+esc(p.deadline):""}</div></div>`).join("");
 document.getElementById("logList").innerHTML=data.logs.length?data.logs.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(l=>`
 <div class="log-item"><div class="log-date">${esc(l.date)} · ${esc(projectName(l.projectId))}</div><div class="log-title">${esc(l.title)}</div><div class="log-body">${esc(l.body)}</div></div>`).join(""):'<div class="empty">还没有项目日志。</div>'
}
function toggleTask(id){const t=data.tasks.find(x=>x.id===id);if(t){t.done=!t.done;save()}}
document.querySelectorAll(".nav button").forEach(btn=>btn.onclick=()=>{document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");["dashboard","today","projects","logs"].forEach(v=>document.getElementById(v+"View").classList.add("hidden"));document.getElementById(btn.dataset.view+"View").classList.remove("hidden")});
function modal(c){document.getElementById("modalRoot").innerHTML='<div class="modal-wrap" onclick="if(event.target===this)closeModal()"><div class="modal">'+c+"</div></div>"}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}
function projectOptions(s=""){return data.projects.map(p=>'<option value="'+p.id+'" '+(p.id===s?"selected":"")+">"+esc(p.name)+"</option>").join("")}

function openTaskModal(){modal(`<h3>新增任务</h3><div class="form-grid"><div class="field full"><label>任务内容</label><input id="fTaskTitle" placeholder="下一步具体要做什么"></div><div class="field"><label>所属项目</label><select id="fTaskProject"><option value="">未归属项目</option>${projectOptions()}</select></div><div class="field"><label>优先级</label><select id="fTaskPriority"><option>高</option><option selected>中</option><option>低</option></select></div></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">取消</button><button class="primary" onclick="addTask()">保存</button></div>`)}
function addTask(){const title=document.getElementById("fTaskTitle").value.trim();if(!title)return;data.tasks.push({id:"t"+Date.now(),title,projectId:document.getElementById("fTaskProject").value,priority:document.getElementById("fTaskPriority").value,done:false});closeModal();save()}

function openProjectModal(id){const p=id?data.projects.find(x=>x.id===id):null;modal(`<h3>${p?"编辑项目":"新增项目"}</h3><div class="form-grid">
<div class="field full"><label>项目名称</label><input id="fPName" value="${p?esc(p.name):""}"></div>
<div class="field full"><label>项目背景 / 目标</label><textarea id="fPBackground">${p?esc(p.background):""}</textarea></div>
<div class="field full"><label>当前进展</label><textarea id="fPCurrent">${p?esc(p.current):""}</textarea></div>
<div class="field full"><label>下一步工作</label><textarea id="fPNext">${p?esc(p.next):""}</textarea></div>
<div class="field"><label>项目状态</label><select id="fPStatus">${["进行中","等待中","已完成"].map(x=>'<option '+(p?.status===x?"selected":"")+">"+x+"</option>").join("")}</select></div>
<div class="field"><label>优先级</label><select id="fPPriority">${["高","中","低"].map(x=>'<option '+(p?.priority===x?"selected":"")+">"+x+"</option>").join("")}</select></div>
<div class="field"><label>完成进度 %</label><input id="fPProgress" type="number" min="0" max="100" value="${p?.progress??0}"></div>
<div class="field"><label>截止日期</label><input id="fPDeadline" value="${p?esc(p.deadline):""}" placeholder="YYYY-MM-DD 或文字说明"></div></div>
<div class="modal-actions">${p?'<button class="danger" onclick="deleteProject(\''+p.id+'\')">删除项目</button>':""}<button class="secondary" onclick="closeModal()">取消</button><button class="primary" onclick="saveProject('${p?.id||""}')">保存</button></div>`)}
function saveProject(id){const obj={id:id||"p"+Date.now(),name:document.getElementById("fPName").value.trim(),background:document.getElementById("fPBackground").value.trim(),current:document.getElementById("fPCurrent").value.trim(),next:document.getElementById("fPNext").value.trim(),status:document.getElementById("fPStatus").value,priority:document.getElementById("fPPriority").value,progress:Math.max(0,Math.min(100,Number(document.getElementById("fPProgress").value||0))),deadline:document.getElementById("fPDeadline").value.trim()};if(!obj.name)return;if(id){data.projects[data.projects.findIndex(x=>x.id===id)]=obj}else data.projects.push(obj);closeModal();save()}
function deleteProject(id){data.projects=data.projects.filter(p=>p.id!==id);data.tasks=data.tasks.map(t=>t.projectId===id?{...t,projectId:""}:t);closeModal();save()}

function openLogModal(){modal(`<h3>新增项目进展</h3><div class="form-grid"><div class="field"><label>日期</label><input id="fLDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>所属项目</label><select id="fLProject">${projectOptions()}</select></div><div class="field full"><label>进展标题</label><input id="fLTitle" placeholder="例如：完成中国案例检索第一轮"></div><div class="field full"><label>详细内容 / 关键结论</label><textarea id="fLBody"></textarea></div></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">取消</button><button class="primary" onclick="addLog()">保存</button></div>`)}
function addLog(){const title=document.getElementById("fLTitle").value.trim();if(!title)return;data.logs.push({id:"l"+Date.now(),date:document.getElementById("fLDate").value,projectId:document.getElementById("fLProject").value,title,body:document.getElementById("fLBody").value.trim()});closeModal();save()}

document.getElementById("exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="项目工作台备份.json";a.click();URL.revokeObjectURL(a.href)};
document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save();alert("导入完成。")}catch(e){alert("备份文件无效。")}};r.readAsText(f)};
renderAll();
</script>
</body>
</html>
